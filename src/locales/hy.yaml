supportUkraine: "Աջակցեք Ուկրաինային –"
regionLabel: Ուկրաինային աջակցության պաստառ
more: ավելին…
donate: Նվիրաբերել
refresh: Ցույց տալ հաջորդ կազմակերպությունը
opensInNewTab: (բացվում է նոր ներդիրում)
charities:
  united24:
    tagline: Ուկրաինայի պաշտոնական դրամահավաքի հարթակ
  come-back-alive:
    tagline: Աջակցում է Ուկրաինայի զինված ուժերին 2014 թվականից
  razom-for-ukraine:
    tagline: Արտակարգ արձագանք և մարդասիրական օգնություն
  ukrainian-red-cross:
    tagline: Մարդասիրական օգնություն հակամարտության գոտիներում
  nova-ukraine:
    tagline: Մարդասիրական օգնություն և շահերի պաշտպանություն
  voices-of-children:
    tagline: Հոգեբանական աջակցություն պատերազմից տուժած երեխաներին
  prytula-foundation:
    tagline: Պաշտպանական տեխնոլոգիաներ և սարքավորումներ Ուկրաինայի համար
  world-central-kitchen:
    tagline: Թարմ սնունդ հակամարտության գոտիներում գտնվող մարդկանց համար
  cats-of-kyiv:
    tagline: Կատուների ապաստարան, որը փրկում է Կիևի կատուներին և նոր տուն գտնում նրանց համար
  uanimals:
    tagline: Կենդանիների փրկության և պաշտպանության կազմակերպություն Ուկրաինայում
  hospitallers:
    tagline: Ուկրաինացի կամավոր բուժաշխատողներ, որոնք ցուցաբերում են առաջին օգնություն և իրականացնում տարհանում
  sternenko-fund:
    tagline: FPV անօդաչուներ Ուկրաինայի պաշտպանական ուժերի համար
  life-robots-ukraine:
    tagline: Ռոբոտներ Ուկրաինայի ականազերծման համար
  sirius-shelter:
    tagline: Ուկրաինայի ամենամեծ ապաստարանը շների և կատուների համար
  dzygaspaw:
    tagline: Կյանքեր փրկող տեխնոլոգիաներ ուկրաինացի պաշտպանների համար
  dignitas:
    tagline: Տեխնոլոգիաներ և աջակցություն ուկրաինացի պաշտպաններին և վետերաններին
  leleka:
    tagline: Մարտական բժշկական պարագաներ Ուկրաինայի առաջնագծի բուժաշխատողների համար
  superhumans:
    tagline: Պրոթեզավորում, վիրաբուժություն և վերականգնում պատերազմից փրկվածների համար
  nikopol-chance:
    tagline: Շների ապաստարան, որը փրկում է առաջնագծի Նիկոպոլի թափառող շներին և տուն գտնում նրանց համար
  donorua:
    tagline: Համակարգում է կամավոր արյան դոնորությունը Ուկրաինայում
  army-sos:
    tagline: Սնունդ և աջակցություն ուկրաինական զորքերին
  soloma-cats:
    tagline: Մարտական բժշկություն և ականազերծում
  united-help-ukraine:
    tagline: Վիրավոր զինվորների վերականգնում և տեղահանվածների աջակցություն
  sprava-hromad:
    tagline: Զրահատեխնիկա, բեռնատարներ և անօդաչու համակարգեր առաջնագծի ստորաբաժանումների համար
