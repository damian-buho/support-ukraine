<head>
  <meta charset="UTF-8">

  <title>Support Ukraine — All Charities</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, -Segoe-ui, sans-serif;
      background: #fafafa;
      color: #222;
      line-height: 1.5;
    }

    .header {
      background: #0057b7;
      color: #fff;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .header__title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .header__subtitle {
      font-size: 1rem;
      opacity: 0.9;
    }

    .controls {
      display: flex;
      justify-content: center;
      padding: 1rem 1.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .picker {
      padding: 0.5rem 1rem;
      border: 1px solid #ccc;
      border-radius: 0.375rem;
      font-size: 0.95rem;
      background: #fff;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
      padding: 1rem 1.5rem 3rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 0.5rem;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.15s;
    }

    .card:hover {
      border-color: #0057b7;
    }

    .card__name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .card__tagline {
      font-size: 0.9rem;
      color: #555;
      flex: 1;
    }

    .card__link {
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
      margin-top: 0.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #0057b7;
      text-decoration: none;
    }

    .card__link:hover {
      text-decoration: underline;
    }

    .card__tags {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.15em 0.5em;
      border-radius: 999px;
      background: #e8f0fe;
      color: #0057b7;
      font-weight: 500;
    }

    .tag--inverse {
      background: #0057b7;
      color: #fff;
    }

    [dir="rtl"] .card__link { flex-direction: row-reverse; }
    [dir="rtl"] .header { direction: rtl; }

    .footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: #888;
      border-top: 1px solid #e0e0e0;
    }

    .footer a { color: #0057b7; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #eee; }
      .picker { background: #2a2a2a; border-color: #444; color: #eee; }
      .card { background: #2a2a2a; border-color: #444; }
      .card:hover { border-color: #0057b7; }
      .card__tagline { color: #aaa; }
      .tag { background: #1a3a5c; color: #6db3f8; }
      .tag--inverse { background: #6db3f8; color: #1a3a5c; }
      .footer { border-color: #444; color: #aaa; }
    }
  </style>
</head>

    const PAGE_COPY = {"en":{"title":"Support Ukraine","subtitle":"All charities"},"es":{"title":"Apoya a Ucrania","subtitle":"Todas las charities"},"fr":{"title":"Soutenir l'Ukraine","subtitle":"Toutes les charities"},"de":{"title":"Ukraine unterstützen","subtitle":"Alle Organisationen"},"pt":{"title":"Apoie a Ucrânia","subtitle":"Todas as organizações"},"it":{"title":"Sostieni l'Ucraina","subtitle":"Tutte le organizzazioni"},"pl":{"title":"Wesprzyj Ukrainę","subtitle":"Wszystkie organizacje"},"nl":{"title":"Steun Oekraïne","subtitle":"Alle organisaties"},"sv":{"title":"Stöd Ukraina","subtitle":"Alla organisationer"},"uk":{"title":"Підтримай Україну","subtitle":"Усі організації"},"ar":{"title":"ادعم أوكرانيا","subtitle":"جميع الجهات"},"zh":{"title":"支持乌克兰","subtitle":"所有慈善机构"},"hi":{"title":"यूक्रेन का समर्थन करें","subtitle":"सभी धर्मार्थ संस्थाएँ"},"th":{"title":"สนับสนุนยูเครน","subtitle":"องค์กรทั้งหมด"},"ja":{"title":"ウクライナを支援する","subtitle":"すべての団体"},"ko":{"title":"우크라이나를 지원합니다","subtitle":"모든 단체"}};
    const RTL_LOCALES = ["ar"];

    // ── DOM refs ────────────────────────────────────────────────────
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const gridEl = document.getElementById('grid');
    const langEl = document.getElementById('lang');
    const footerEl = document.getElementById('footer');

    // ── Locale detection ────────────────────────────────────────────
    function detectLocale() {
      const params = new URLSearchParams(location.search);
      const fromUrl = params.get('lang');
      if (fromUrl && TRANSLATIONS[fromUrl]) return fromUrl;

      for (const tag of navigator.languages || []) {
        const base = tag.split('-', 1)[0].toLowerCase();
        if (TRANSLATIONS[base]) return base;
      }
      return 'en';
    }

    // ── Render ──────────────────────────────────────────────────────
    function render(code) {
      const t = TRANSLATIONS[code] || TRANSLATIONS.en;
      const copy = PAGE_COPY[code] || PAGE_COPY.en;
      const isRtl = RTL_LOCALES.includes(code);

      document.documentElement.lang = code;
      document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
      document.title = `${copy.title} — ${copy.subtitle}`;

      titleEl.textContent = `🇺🇦 ${copy.title}`;
      subtitleEl.textContent = copy.subtitle;

      gridEl.innerHTML = '';
      for (const c of CHARITIES) {
        const localized = t.charities[c.id] || { tagline: c.tagline };
        const href = c.urls[code] || c.urls.en;

        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <h2 class="card__name">${c.name}${c.is501c3 ? ' <span class="tag tag--inverse">501(c)(3)</span>' : ''}</h2>
          <p class="card__tagline">${localized.tagline}</p>
          <div class="card__tags">
            ${c.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
          <a class="card__link" href="${href}" target="_blank" rel="noopener noreferrer">
            ${t.donate} →
          </a>
        `;
        gridEl.appendChild(card);
      }

      footerEl.innerHTML = `<a href="https://github.com/damian-buho/support-ukraine">support-ukraine</a> · MIT`;

      // Sync picker
      langEl.value = code;

      // Update URL without reload
      const url = new URL(location);
      url.searchParams.set('lang', code);
      history.replaceState(null, '', url);
    }

    // ── Init ────────────────────────────────────────────────────────
    const initial = detectLocale();
    render(initial);

    langEl.addEventListener('change', () => render(langEl.value));
  </script>
